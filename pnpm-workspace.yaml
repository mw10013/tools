saveExact: true
runtimeOnFail: ignore
pmOnFail: ignore
allowBuilds:
  # Alchemy depends on workerd; tools only types and plans against Alchemy, never runs a Worker.
  workerd: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowedVersions:
    vite: "*"
